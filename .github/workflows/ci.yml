name: ci

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The capture script and the hidden-verify driver are tested in Playwright's bundled Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
