<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>01 — Inbox</title>
  <style>
    :root { font-family: Inter, sans-serif; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    .rail { background: var(--ink); border-right: 1px solid var(--rule); }
    .rail a:hover, .rail a:focus { color: var(--paper-bright); }
    @media (min-width: 900px) {
      .card { box-shadow: 0 1px 2px var(--shadow); }
    }
  </style>
</head>
<body>
  <nav class="rail" style="width: 240px; color: var(--paper-bright)"></nav>
  <main>
    <p>The brief's accent is <code>#2D5BE3</code>; the tool used #f7f7f5 for the page.</p>
    <button style="background:#0b3d91;color:var(--paper-bright);border:0">Compose</button>
  </main>
</body>
</html>
